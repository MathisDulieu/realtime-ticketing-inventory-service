# Server
server:
  port: 8082

# Spring
spring:
  kafka:
    bootstrap-servers: localhost:9092

# Logging
logging:
  level:
    root: INFO
    com.mathisdulieu.ticketing: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){blue} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n"

# Swagger
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# CORS
cors:
  allowed-origin: http://localhost:8080

# Inventory
inventory:
  mongodb:
    uri: mongodb://localhost:27017
    database-name: inventory-service
